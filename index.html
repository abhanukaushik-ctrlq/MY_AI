
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY AI - Your AI Assistant</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #212121;
  color: white;
  display: flex;
  height: 100vh;
}

.sidebar {
  width: 250px;
  background: #171717;
  padding: 20px;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  color: #10a37f;
  margin-bottom: 30px;
}

.new-chat {
  width: 100%;
  padding: 13px;
  border: 1px solid #555;
  border-radius: 10px;
  background: transparent;
  color: white;
  cursor: pointer;
}

.new-chat:hover { background: #333; }

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

header {
  padding: 18px 25px;
  border-bottom: 1px solid #383838;
  font-size: 19px;
  font-weight: bold;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 25px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.welcome {
  margin: auto;
  text-align: center;
}

.welcome h1 {
  font-size: 35px;
}

.welcome p { color: #aaa; }

.message {
  max-width: 750px;
  width: fit-content;
  padding: 14px 18px;
  border-radius: 15px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #343541;
  align-self: flex-end;
}

.ai {
  background: #2b2b2b;
  align-self: flex-start;
}

.input-area {
  padding: 15px 20px 25px;
}

.input-box {
  max-width: 800px;
  margin: auto;
  display: flex;
  gap: 10px;
  background: #303030;
  border: 1px solid #555;
  border-radius: 15px;
  padding: 10px;
}

input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-size: 16px;
  padding: 10px;
}

.send {
  background: #10a37f;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  cursor: pointer;
}

.send:hover { background: #0d8c6d; }

.footer {
  text-align: center;
  color: #888;
  font-size: 12px;
  margin-top: 12px;
}

@media(max-width:600px) {
  .sidebar { display: none; }
  #messages { padding: 15px; }
  .welcome h1 { font-size: 27px; }
}
</style>
</head>

<body>

<aside class="sidebar">
  <div class="logo">✦ MY AI</div>
  <button class="new-chat" onclick="newChat()">+ New Chat</button>
  <p style="color:#888;margin-top:35px">Your AI Assistant</p>
</aside>

<main class="main">
  <header>✦ MY AI</header>

  <div id="messages">
    <div class="welcome" id="welcome">
      <h1>How can I help you today?</h1>
      <p>Ask me anything. Let's explore ideas together.</p>
    </div>
  </div>

  <div class="input-area">
    <div class="input-box">
      <input id="userInput"
        placeholder="Message MY AI..."
        onkeydown="if(event.key==='Enter') sendMessage()">
      <button class="send" onclick="sendMessage()">➤</button>
    </div>
    <div class="footer">
      MY AI can make mistakes. Check important information.
    </div>
  </div>
</main>

<script>
const messages = document.getElementById("messages");
const input = document.getElementById("userInput");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  const welcome = document.getElementById("welcome");
  if (welcome) welcome.remove();

  addMessage(text, "user");
  input.value = "";

  const loading = addMessage("MY AI is thinking...", "ai");

  // Demo response. Connect an AI API here for real AI answers.
  await new Promise(resolve => setTimeout(resolve, 800));

  loading.textContent = getDemoResponse(text);
  messages.scrollTop = messages.scrollHeight;
}

function getDemoResponse(text) {
  const q = text.toLowerCase();

  if (q.includes("hello") || q.includes("hi"))
    return "Hello! 👋 Welcome to MY AI. How can I help you today?";

  if (q.includes("your name"))
    return "I'm MY AI, your friendly AI assistant! 🤖";

  if (q.includes("who are you"))
    return "I'm MY AI! I'm a demo chatbot interface. Connect me to an AI API to unlock intelligent conversations.";

  if (q.includes("html"))
    return "HTML is the language used to create web pages. It structures headings, paragraphs, images, buttons and more!";

  if (q.includes("javascript"))
    return "JavaScript makes websites interactive. It can power chatbots, games, animations and much more!";

  return "Thanks for your message! 😊 I'm currently running in demo mode. Connect an AI API to get intelligent answers to any question.";
}

function newChat() {
  messages.innerHTML = `
    <div class="welcome" id="welcome">
      <h1>How can I help you today?</h1>
      <p>Ask me anything. Let's explore ideas together.</p>
    </div>`;
}
</script>

</body>
</html>
